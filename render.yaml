# Render.com deployment manifest (NOT the primary deploy target — production
# runs on Fly.io via fly.toml). Kept as an alternative-host blueprint.
# Provision an external Postgres (e.g. Neon) and wire DATABASE_URL through
# the Render dashboard or sync: false env vars before deploying.
services:
  - type: web
    name: arf-map
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
