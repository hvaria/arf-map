# fly.toml app configuration file
#
# DATABASE_URL must be set via `fly secrets set DATABASE_URL=postgres://...`
# SESSION_SECRET must be set via `fly secrets set SESSION_SECRET=$(openssl rand -hex 32)`
# RESEND_API_KEY must be set via `fly secrets set RESEND_API_KEY=...`
#
# See https://fly.io/docs/reference/configuration/

app = 'ncu'
primary_region = 'lax'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'

# NOTE (Phase 2 R1): the legacy `arf_data` Fly volume mount from the
# SQLite era has been removed. The app no longer writes to /data —
# Postgres (Neon/Supabase) is the system of record. To free the volume
# bytes after the next successful deploy:
#     fly volumes list                # find the vol id
#     fly volumes destroy <vol-id>    # one-shot, irreversible
# The deploy reconciliation no longer requires the mount because every
# machine now boots without /data on its filesystem.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpus = 1
