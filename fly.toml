# fly.toml app configuration file
#
# DATABASE_URL must be set via `fly secrets set DATABASE_URL=postgres://...`
# SESSION_SECRET must be set via `fly secrets set SESSION_SECRET=$(openssl rand -hex 32)`
# RESEND_API_KEY must be set via `fly secrets set RESEND_API_KEY=...`
#
# See https://fly.io/docs/reference/configuration/

app = 'ncu'
primary_region = 'lax'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'

# NOTE: the legacy `arf_data` Fly volume mount has been removed. The app
# no longer writes to /data — Postgres (Neon) is the system of record.
# If `fly deploy` warns that a machine still has a volume mounted, that
# warning can be cleared by destroying the volume once the new release
# is healthy:
#     fly volumes list                # find the vol id
#     fly volumes destroy <vol-id>    # one-shot, irreversible

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  # Health check used by `flyctl deploy --strategy bluegreen` to decide when
  # a green machine is ready to receive traffic. Without this, blue-green
  # flips traffic the moment the machine boots, before the app is ready.
  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  memory = '512mb'
  cpus = 1
